<svg xmlns="http://www.w3.org/2000/svg" width="760" height="680" viewBox="0 0 760 680" role="img" aria-labelledby="title desc">
<title id="title">02 · 协议家族：先问“它在解决什么？”</title>
<desc id="desc">六组协议按职责分类：应用与服务HTTP DNS DHCP，网络与邻居IP ICMP ARP NDP，安全TLS Noise，发现与穿透STUN UPnP NAT-PMP，隧道传输TCP UDP WS WSS QUIC WireGuard FakeTCP，以及TCP流代理KCP QUIC。</desc>
<defs>
<marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1257a6"/></marker>
<marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#087f75"/></marker>
<marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#617382"/></marker>
</defs>
<rect width="760" height="680" rx="16" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#172b3a">
<text x="36" y="49" font-size="29" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="36" dy="0">02 · 协议家族：先问“它在解决什么？”</tspan></text><text x="36" y="81" font-size="18" font-weight="400" fill="#465968" text-anchor="start"><tspan x="36" dy="0">这是职责地图；不同职责并不等于严格的一层 OSI。</tspan></text><path d="M36 102 H724" fill="none" stroke="#dbe5ed" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="36" y="123" width="332" height="134" rx="12" fill="#eef4fa" stroke="#cad9e6" stroke-width="1.5"/><circle cx="65" cy="153" r="15" fill="#1257a6"/><text x="65" y="160" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="65" dy="0">1</tspan></text><text x="90" y="160" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="90" dy="0">应用与服务</tspan></text><text x="54" y="192" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="54" dy="0">HTTP：业务请求与响应</tspan><tspan x="54" dy="27">DNS：名称 → 地址</tspan><tspan x="54" dy="27">DHCP：标准网络地址租约</tspan></text><rect x="392" y="123" width="332" height="134" rx="12" fill="#eef4fa" stroke="#cad9e6" stroke-width="1.5"/><circle cx="421" cy="153" r="15" fill="#1257a6"/><text x="421" y="160" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="421" dy="0">2</tspan></text><text x="446" y="160" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="446" dy="0">网络与邻居</tspan></text><text x="410" y="192" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="410" dy="0">IP / ICMP：寻址与诊断</tspan><tspan x="410" dy="27">ARP / NDP：链路邻居发现</tspan><tspan x="410" dy="27">TUN：通常从 IP 层进入</tspan></text><rect x="36" y="273" width="332" height="134" rx="12" fill="#eaf7f3" stroke="#cad9e6" stroke-width="1.5"/><circle cx="65" cy="303" r="15" fill="#1257a6"/><text x="65" y="310" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="65" dy="0">3</tspan></text><text x="90" y="310" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="90" dy="0">安全与认证</tspan></text><text x="54" y="342" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="54" dy="0">TLS：应用 / WSS 的加密层</tspan><tspan x="54" dy="27">Noise：secure_mode 握手</tspan><tspan x="54" dy="27">加密与 ACL 分别解决问题</tspan></text><rect x="392" y="273" width="332" height="134" rx="12" fill="#eaf7f3" stroke="#cad9e6" stroke-width="1.5"/><circle cx="421" cy="303" r="15" fill="#1257a6"/><text x="421" y="310" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="421" dy="0">4</tspan></text><text x="446" y="310" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="446" dy="0">发现与穿透</tspan></text><text x="410" y="342" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="410" dy="0">STUN：观察外侧映射</tspan><tspan x="410" dy="27">UPnP / NAT-PMP：申请映射</tspan><tspan x="410" dy="27">打洞：尝试建立可达路径</tspan></text><rect x="36" y="423" width="332" height="134" rx="12" fill="#eaf7f3" stroke="#cad9e6" stroke-width="1.5"/><circle cx="65" cy="453" r="15" fill="#1257a6"/><text x="65" y="460" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="65" dy="0">5</tspan></text><text x="90" y="460" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="90" dy="0">隧道传输</tspan></text><text x="54" y="492" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="54" dy="0">TCP / UDP、WS / WSS</tspan><tspan x="54" dy="27">QUIC、WireGuard、FakeTCP</tspan><tspan x="54" dy="27">承载整个 EasyTier 包</tspan></text><rect x="392" y="423" width="332" height="134" rx="12" fill="#eaf7f3" stroke="#cad9e6" stroke-width="1.5"/><circle cx="421" cy="453" r="15" fill="#1257a6"/><text x="421" y="460" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="421" dy="0">6</tspan></text><text x="446" y="460" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="446" dy="0">TCP 流代理</tspan></text><text x="410" y="492" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="410" dy="0">KCP / QUIC TCP 流代理</tspan><tspan x="410" dy="27">接管特定 TCP 流的传输</tspan><tspan x="410" dy="27">KCP 不是 kcp:// 隧道</tspan></text><rect x="36" y="602" width="688" height="56" rx="12" fill="#eaf7f3" stroke="#afd9ce" stroke-width="1.5"/><text x="54" y="632" font-size="18" font-weight="500" fill="#185e56" text-anchor="start"><tspan x="54" dy="0">读图结论：同名协议可能出现在不同位置；先确认职责与处理对象。</tspan></text></g></svg>
