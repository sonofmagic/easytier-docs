<svg xmlns="http://www.w3.org/2000/svg" width="760" height="680" viewBox="0 0 760 680" role="img" aria-labelledby="title desc">
<title id="title">06 · NAT：看见的端点，不一定普遍可达</title>
<desc id="desc">A的同一个本地UDP套接字192.168.10.20:40000向STUN服务器S发送数据，S观察到198.51.100.10:31000；向B发送时NAT可能采用另一端口51001。STUN观察不能保证B可以从该端点进入，过滤规则还可能要求A先向B发送数据。</desc>
<defs>
<marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1257a6"/></marker>
<marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#087f75"/></marker>
<marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#617382"/></marker>
</defs>
<rect width="760" height="680" rx="16" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#172b3a">
<text x="36" y="49" font-size="29" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="36" dy="0">06 · NAT：看见的端点，不一定普遍可达</tspan></text><text x="36" y="81" font-size="18" font-weight="400" fill="#465968" text-anchor="start"><tspan x="36" dy="0">候选地址是线索；映射与入站过滤是两道独立条件。</tspan></text><path d="M36 102 H724" fill="none" stroke="#dbe5ed" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="36" y="122" width="320" height="107" rx="12" fill="#eef4fa" stroke="#cad9e6" stroke-width="1.5"/><circle cx="65" cy="152" r="15" fill="#1257a6"/><text x="65" y="159" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="65" dy="0">1</tspan></text><text x="90" y="159" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="90" dy="0">A 的本地 UDP 套接字</tspan></text><text x="54" y="191" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="54" dy="0">192.168.10.20:40000</tspan><tspan x="54" dy="27">虚拟地址：10.144.144.1</tspan></text><rect x="390" y="122" width="334" height="107" rx="12" fill="#fff4db" stroke="#cad9e6" stroke-width="1.5"/><circle cx="419" cy="152" r="15" fill="#1257a6"/><text x="419" y="159" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="419" dy="0">2</tspan></text><text x="444" y="159" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="444" dy="0">NAT 路由器</tspan></text><text x="408" y="191" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="408" dy="0">映射：决定外侧 IP / 端口</tspan><tspan x="408" dy="27">过滤：决定允许谁进入</tspan></text><path d="M359 176 H387" fill="none" stroke="#1257a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><rect x="36" y="315" width="320" height="145" rx="12" fill="#eef4fa" stroke="#cad9e6" stroke-width="1.5"/><text x="54" y="352" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="54" dy="0">S：STUN 服务器</tspan></text><text x="54" y="384" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="54" dy="0">提供映射观察的服务</tspan><tspan x="54" dy="27">“我看见 A：</tspan><tspan x="54" dy="27">198.51.100.10:31000”</tspan></text><rect x="390" y="315" width="334" height="145" rx="12" fill="#eaf7f3" stroke="#cad9e6" stroke-width="1.5"/><text x="408" y="352" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="408" dy="0">B：真正通信的目标</tspan></text><text x="408" y="384" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="408" dy="0">203.0.113.20:32000</tspan><tspan x="408" dy="27">向 B 发送时也可能映射为</tspan><tspan x="408" dy="27">198.51.100.10:31001</tspan></text><path d="M471 231 V268 H196 V306" fill="none" stroke="#1257a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><text x="42" y="263" font-size="19" font-weight="600" fill="#1257a6" text-anchor="start"><tspan x="42" dy="0">① 向 S 发包</tspan></text><path d="M641 231 V306" fill="none" stroke="#087f75" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><text x="504" y="280" font-size="19" font-weight="600" fill="#087f75" text-anchor="start"><tspan x="504" dy="0">② 向 B 发包</tspan></text><rect x="36" y="478" width="688" height="114" rx="12" fill="#eaf7f3" stroke="#cad9e6" stroke-width="1.5"/><text x="54" y="515" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="54" dy="0">B 要打洞，还需要什么？</tspan></text><text x="54" y="547" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="54" dy="0">候选地址与实际映射匹配 + NAT 过滤允许入站 + 路径无阻断</tspan><tspan x="54" dy="27">双方主动发包能创造条件，但不能保证每种 NAT 都成功。</tspan></text><rect x="36" y="602" width="688" height="56" rx="12" fill="#eaf7f3" stroke="#afd9ce" stroke-width="1.5"/><text x="54" y="632" font-size="18" font-weight="500" fill="#185e56" text-anchor="start"><tspan x="54" dy="0">教学地址：同一端口的外侧映射是否随目标变化，要靠观察而非猜测。</tspan></text></g></svg>
