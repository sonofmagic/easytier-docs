<svg xmlns="http://www.w3.org/2000/svg" width="760" height="680" viewBox="0 0 760 680" role="img" aria-labelledby="title desc">
<title id="title">05 · 从启动到可用路径</title>
<desc id="desc">节点加载配置，连接初始对等节点，交换成员与路由信息，随后按条件进行STUN观察与候选端点交换、双向打洞。直连成功使用A到B路径，失败时可通过已存在的R中继路径，保活与路由更新继续维护可达性。</desc>
<defs>
<marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1257a6"/></marker>
<marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#087f75"/></marker>
<marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#617382"/></marker>
</defs>
<rect width="760" height="680" rx="16" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#172b3a">
<text x="36" y="49" font-size="29" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="36" dy="0">05 · 从启动到可用路径</tspan></text><text x="36" y="81" font-size="18" font-weight="400" fill="#465968" text-anchor="start"><tspan x="36" dy="0">连上一个节点，是发现整个网络的起点。</tspan></text><path d="M36 102 H724" fill="none" stroke="#dbe5ed" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="36" y="122" width="332" height="88" rx="12" fill="#eef4fa" stroke="#cad9e6" stroke-width="1.5"/><circle cx="65" cy="152" r="15" fill="#1257a6"/><text x="65" y="159" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="65" dy="0">1</tspan></text><text x="90" y="159" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="90" dy="0">加载配置与监听</tspan></text><text x="54" y="191" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="54" dy="0">网络身份、接口、初始 peers</tspan></text><rect x="392" y="122" width="332" height="88" rx="12" fill="#eef4fa" stroke="#cad9e6" stroke-width="1.5"/><circle cx="421" cy="152" r="15" fill="#1257a6"/><text x="421" y="159" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="421" dy="0">2</tspan></text><text x="446" y="159" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="446" dy="0">连接初始对等节点</tspan></text><text x="410" y="191" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="410" dy="0">完成匹配模式下的建链与验证</tspan></text><path d="M370 166 H388" fill="none" stroke="#1257a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M558 214 V244" fill="none" stroke="#1257a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><rect x="392" y="251" width="332" height="108" rx="12" fill="#eef4fa" stroke="#cad9e6" stroke-width="1.5"/><circle cx="421" cy="281" r="15" fill="#1257a6"/><text x="421" y="288" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="421" dy="0">3</tspan></text><text x="446" y="288" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="446" dy="0">交换成员与路由</tspan></text><text x="410" y="320" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="410" dy="0">内部 RPC 传递控制信息</tspan><tspan x="410" dy="27">知道“B 在哪、怎样到达 B”</tspan></text><rect x="36" y="251" width="332" height="108" rx="12" fill="#eef4fa" stroke="#cad9e6" stroke-width="1.5"/><circle cx="65" cy="281" r="15" fill="#1257a6"/><text x="65" y="288" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="65" dy="0">4</tspan></text><text x="90" y="288" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="90" dy="0">尝试建立直连</tspan></text><text x="54" y="320" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="54" dy="0">按条件获取 STUN / 候选端点</tspan><tspan x="54" dy="27">双向发送打洞数据</tspan></text><path d="M388 296 H371" fill="none" stroke="#1257a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M202 364 V383" fill="none" stroke="#1257a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><rect x="36" y="390" width="332" height="99" rx="12" fill="#eaf7f3" stroke="#cad9e6" stroke-width="1.5"/><text x="54" y="427" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="54" dy="0">成功：A → B</tspan></text><text x="54" y="459" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="54" dy="0">更少中间跳数</tspan><tspan x="54" dy="27">路径可达才成为有效连接</tspan></text><rect x="392" y="390" width="332" height="99" rx="12" fill="#fff4db" stroke="#cad9e6" stroke-width="1.5"/><text x="410" y="427" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="410" dy="0">未成功：A → R → B</tspan></text><text x="410" y="459" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="410" dy="0">利用已有可达中继路径</tspan><tspan x="410" dy="27">R 必须可达并允许转发</tspan></text><path d="M202 364 V369 H558 V383" fill="none" stroke="#617382" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-gray)"/><text x="385" y="375" font-size="18" font-weight="400" fill="#617382" text-anchor="middle"><tspan x="385" dy="0">直连未建立</tspan></text><text x="36" y="528" font-size="20" font-weight="600" fill="#172b3a" text-anchor="start"><tspan x="36" dy="0">⑤ 持续保活与路由更新；路径失效后重新评估和连接。</tspan></text><rect x="36" y="602" width="688" height="56" rx="12" fill="#eaf7f3" stroke="#afd9ce" stroke-width="1.5"/><text x="54" y="632" font-size="18" font-weight="500" fill="#185e56" text-anchor="start"><tspan x="54" dy="0">教学流程：步骤可并发、重复；STUN 与打洞并非每次建链都必经。</tspan></text></g></svg>
