<svg xmlns="http://www.w3.org/2000/svg" width="760" height="680" viewBox="0 0 760 680" role="img" aria-labelledby="title desc">
<title id="title">03 · 一个请求怎样穿过 EasyTier</title>
<desc id="desc">A的HTTP业务形成TCP/IP包。系统把发往10.144.144.2的包送到TUN，EasyTier增加节点头并加密载荷，外层UDP或TCP通过真实网络传输，B解封装和解密后把原始IP包注入TUN。</desc>
<defs>
<marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1257a6"/></marker>
<marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#087f75"/></marker>
<marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#617382"/></marker>
</defs>
<rect width="760" height="680" rx="16" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#172b3a">
<text x="36" y="49" font-size="29" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="36" dy="0">03 · 一个请求怎样穿过 EasyTier</tspan></text><text x="36" y="81" font-size="18" font-weight="400" fill="#465968" text-anchor="start"><tspan x="36" dy="0">编号表示发送方向；回程沿 ⑤ → ① 返回。</tspan></text><path d="M36 102 H724" fill="none" stroke="#dbe5ed" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="62" y="121" width="662" height="79" rx="12" fill="#eef4fa" stroke="#cad9e6" stroke-width="1.5"/><circle cx="91" cy="151" r="15" fill="#1257a6"/><text x="91" y="158" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="91" dy="0">1</tspan></text><text x="116" y="158" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="116" dy="0">A：应用生成请求</tspan></text><text x="80" y="190" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="80" dy="0">HTTP → TCP → IP：10.144.144.1 → 10.144.144.2</tspan></text><path d="M42 148 V233" fill="none" stroke="#1257a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><rect x="62" y="214" width="662" height="79" rx="12" fill="#eef4fa" stroke="#cad9e6" stroke-width="1.5"/><circle cx="91" cy="244" r="15" fill="#1257a6"/><text x="91" y="251" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="91" dy="0">2</tspan></text><text x="116" y="251" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="116" dy="0">A：系统路由到 TUN</tspan></text><text x="80" y="283" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="80" dy="0">EasyTier 从虚拟接口读取内层 IP 包</tspan></text><path d="M42 241 V326" fill="none" stroke="#1257a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><rect x="62" y="307" width="662" height="79" rx="12" fill="#eaf7f3" stroke="#cad9e6" stroke-width="1.5"/><circle cx="91" cy="337" r="15" fill="#1257a6"/><text x="91" y="344" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="91" dy="0">3</tspan></text><text x="116" y="344" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="116" dy="0">A：节点处理与加密</tspan></text><text x="80" y="376" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="80" dy="0">节点头指明目标；内层 IP 包成为加密载荷</tspan></text><path d="M42 334 V419" fill="none" stroke="#1257a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><rect x="62" y="400" width="662" height="79" rx="12" fill="#eef4fa" stroke="#cad9e6" stroke-width="1.5"/><circle cx="91" cy="430" r="15" fill="#1257a6"/><text x="91" y="437" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="91" dy="0">4</tspan></text><text x="116" y="437" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="116" dy="0">真实网络：外层隧道</tspan></text><text x="80" y="469" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="80" dy="0">外层 IP + UDP / TCP + EasyTier 数据</tspan></text><path d="M42 427 V512" fill="none" stroke="#1257a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><rect x="62" y="493" width="662" height="79" rx="12" fill="#eef4fa" stroke="#cad9e6" stroke-width="1.5"/><circle cx="91" cy="523" r="15" fill="#1257a6"/><text x="91" y="530" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="91" dy="0">5</tspan></text><text x="116" y="530" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="116" dy="0">B：恢复原始包并交给系统</tspan></text><text x="80" y="562" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="80" dy="0">解封装 → 解密 → 注入 TUN → 交给应用</tspan></text><rect x="36" y="602" width="688" height="56" rx="12" fill="#eaf7f3" stroke="#afd9ce" stroke-width="1.5"/><text x="54" y="632" font-size="18" font-weight="500" fill="#185e56" text-anchor="start"><tspan x="54" dy="0">教学模型：省略压缩、代理和中继；是否直连不改变内层目的地址。</tspan></text></g></svg>
