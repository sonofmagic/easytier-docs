<svg xmlns="http://www.w3.org/2000/svg" width="760" height="680" viewBox="0 0 760 680" role="img" aria-labelledby="title desc">
<title id="title">10 · 丢包恢复：哪一层在等，哪一层在重传？</title>
<desc id="desc">内层TCP经外层UDP隧道发送，UDP不提供可靠重传，内层TCP负责恢复。经外层TCP隧道时，外层TCP对丢失段重传且按序交付，会阻塞后续EasyTier帧，内层TCP也有自己的计时器。QUIC的恢复和阻塞范围取决于实际流映射，不能宣称零阻塞。</desc>
<defs>
<marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1257a6"/></marker>
<marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#087f75"/></marker>
<marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#617382"/></marker>
</defs>
<rect width="760" height="680" rx="16" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#172b3a">
<text x="36" y="49" font-size="29" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="36" dy="0">10 · 丢包恢复：哪一层在等，哪一层在重传？</tspan></text><text x="36" y="81" font-size="18" font-weight="400" fill="#465968" text-anchor="start"><tspan x="36" dy="0">比较教学模型：常规内层 TCP，不启用 TCP 流代理。</tspan></text><path d="M36 102 H724" fill="none" stroke="#dbe5ed" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="36" y="125" width="332" height="70" rx="12" fill="#eef4fa" stroke="#cad9e6" stroke-width="1.5"/><text x="54" y="162" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="54" dy="0">内层 TCP / 外层 UDP</tspan></text><rect x="392" y="125" width="332" height="70" rx="12" fill="#eaf7f3" stroke="#cad9e6" stroke-width="1.5"/><text x="410" y="162" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="410" dy="0">内层 TCP / 外层 TCP</tspan></text><text x="54" y="234" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="54" dy="0">发出：①   ②   ③</tspan></text><text x="54" y="276" font-size="23" font-weight="700" fill="#9b4323" text-anchor="start"><tspan x="54" dy="0">网络：①   ×   ③</tspan></text><text x="410" y="234" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="410" dy="0">发出：①   ②   ③</tspan></text><text x="410" y="276" font-size="23" font-weight="700" fill="#9b4323" text-anchor="start"><tspan x="410" dy="0">网络：①   ×   ③</tspan></text><rect x="36" y="315" width="332" height="157" rx="12" fill="#eef4fa" stroke="#cad9e6" stroke-width="1.5"/><text x="54" y="352" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="54" dy="0">外层 UDP 不做可靠重传</tspan></text><text x="54" y="384" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="54" dy="0">③ 可以先到接收端</tspan><tspan x="54" dy="27">内层 TCP 发现缺口</tspan><tspan x="54" dy="27">确认 / 超时触发恢复</tspan><tspan x="54" dy="27">应用仍按 TCP 顺序读取</tspan></text><rect x="392" y="315" width="332" height="157" rx="12" fill="#eaf7f3" stroke="#cad9e6" stroke-width="1.5"/><text x="410" y="352" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="410" dy="0">外层 TCP 先恢复缺口</tspan></text><text x="410" y="384" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="410" dy="0">③ 在外层按序交付前等待</tspan><tspan x="410" dy="27">外层 TCP 重传 ②</tspan><tspan x="410" dy="27">内层 TCP 仍有自己的计时器</tspan><tspan x="410" dy="27">嵌套恢复可能增加等待</tspan></text><text x="36" y="515" font-size="21" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="36" dy="0">外层可靠性与内层可靠性可以同时存在。</tspan><tspan x="36" dy="35">QUIC 并非“零阻塞”；恢复范围要看实际流映射。</tspan></text><rect x="36" y="602" width="688" height="56" rx="12" fill="#eaf7f3" stroke="#afd9ce" stroke-width="1.5"/><text x="54" y="632" font-size="18" font-weight="500" fill="#185e56" text-anchor="start"><tspan x="54" dy="0">读图结论：用丢包、延迟、吞吐的证据选传输；没有永远最快的协议。</tspan></text></g></svg>
