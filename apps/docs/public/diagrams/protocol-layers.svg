<svg xmlns="http://www.w3.org/2000/svg" width="760" height="680" viewBox="0 0 760 680" role="img" aria-labelledby="title desc">
<title id="title">01 · 协议分层：一封信，多层信封</title>
<desc id="desc">A向B发送未启用TLS的HTTP请求。内层HTTP经TCP和IP进入TUN，再成为EasyTier加密载荷，最后装入真实网络的UDP或TCP隧道。虚拟地址与公网地址属于不同层。</desc>
<defs>
<marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1257a6"/></marker>
<marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#087f75"/></marker>
<marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#617382"/></marker>
</defs>
<rect width="760" height="680" rx="16" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#172b3a">
<text x="36" y="49" font-size="29" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="36" dy="0">01 · 协议分层：一封信，多层信封</tspan></text><text x="36" y="81" font-size="18" font-weight="400" fill="#465968" text-anchor="start"><tspan x="36" dy="0">从应用往下读；B 收到后按相反顺序打开。</tspan></text><path d="M36 102 H724" fill="none" stroke="#dbe5ed" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="63" y="125" width="661" height="57" rx="12" fill="#eef4fa" stroke="#cad9e6" stroke-width="1.5"/><text x="80" y="160" font-size="20" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="80" dy="0">应用层</tspan></text><text x="218" y="160" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="218" dy="0">HTTP：GET /（未启用 TLS 的示例）</tspan></text><rect x="63" y="194" width="661" height="57" rx="12" fill="#eef4fa" stroke="#cad9e6" stroke-width="1.5"/><text x="80" y="229" font-size="20" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="80" dy="0">内层传输</tspan></text><text x="218" y="229" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="218" dy="0">TCP：应用端口、排序、确认、重传</tspan></text><rect x="63" y="263" width="661" height="57" rx="12" fill="#eef4fa" stroke="#cad9e6" stroke-width="1.5"/><text x="80" y="298" font-size="20" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="80" dy="0">内层网络</tspan></text><text x="218" y="298" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="218" dy="0">IP：10.144.144.1 → 10.144.144.2</tspan></text><rect x="63" y="332" width="661" height="57" rx="12" fill="#eaf7f3" stroke="#cad9e6" stroke-width="1.5"/><text x="80" y="367" font-size="20" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="80" dy="0">覆盖网络</tspan></text><text x="218" y="367" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="218" dy="0">EasyTier：节点头 + 加密的内层 IP 包</tspan></text><rect x="63" y="401" width="661" height="57" rx="12" fill="#fff4db" stroke="#cad9e6" stroke-width="1.5"/><text x="80" y="436" font-size="20" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="80" dy="0">外层传输</tspan></text><text x="218" y="436" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="218" dy="0">UDP 或 TCP：连接真实端点</tspan></text><rect x="63" y="470" width="661" height="57" rx="12" fill="#fff4db" stroke="#cad9e6" stroke-width="1.5"/><text x="80" y="505" font-size="20" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="80" dy="0">真实网络</tspan></text><text x="218" y="505" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="218" dy="0">外层 IP：A 的公网端点 → B 的公网端点</tspan></text><path d="M44 138 V515" fill="none" stroke="#1257a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><text x="36" y="555" font-size="20" font-weight="600" fill="#172b3a" text-anchor="start"><tspan x="36" dy="0">TUN 的边界：系统交给 EasyTier 的是内层 IP 包。</tspan></text><rect x="36" y="602" width="688" height="56" rx="12" fill="#eaf7f3" stroke="#afd9ce" stroke-width="1.5"/><text x="54" y="632" font-size="18" font-weight="500" fill="#185e56" text-anchor="start"><tspan x="54" dy="0">读图结论：切换外层 UDP / TCP，不会把内层业务 TCP 改成 UDP。</tspan></text></g></svg>
