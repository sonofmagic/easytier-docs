<svg xmlns="http://www.w3.org/2000/svg" width="760" height="680" viewBox="0 0 760 680" role="img" aria-labelledby="title desc">
<title id="title">09 · 传输的两条轴：隧道与 TCP 流代理</title>
<desc id="desc">隧道选择TCP UDP WS WSS QUIC WireGuard FakeTCP，负责承载EasyTier包。TCP流代理选择KCP或QUIC，接管指定的内层TCP流，并继续通过EasyTier数据路径传输。QUIC在这两个位置含义不同，KCP不能写作kcp://隧道地址。v2.6.4的QUIC隧道使用quinn_plaintext后端，不能按通用QUIC推断TLS身份安全；WSS客户端跳过服务端证书身份校验。</desc>
<defs>
<marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1257a6"/></marker>
<marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#087f75"/></marker>
<marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#617382"/></marker>
</defs>
<rect width="760" height="680" rx="16" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#172b3a">
<text x="36" y="49" font-size="29" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="36" dy="0">09 · 传输的两条轴：隧道与 TCP 流代理</tspan></text><text x="36" y="81" font-size="18" font-weight="400" fill="#465968" text-anchor="start"><tspan x="36" dy="0">先区分处理对象，再比较延迟、丢包与可达性。</tspan></text><path d="M36 102 H724" fill="none" stroke="#dbe5ed" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="36" y="125" width="688" height="111" rx="12" fill="#eef4fa" stroke="#cad9e6" stroke-width="1.5"/><text x="54" y="162" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="54" dy="0">① 外层隧道：搬运整个 EasyTier 包</tspan></text><text x="54" y="194" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="54" dy="0">TCP / UDP · WS / WSS · QUIC · WireGuard · FakeTCP</tspan><tspan x="54" dy="27">影响真实网络上的连接方式；部分能力需要对应构建特性。</tspan></text><rect x="36" y="278" width="688" height="111" rx="12" fill="#eaf7f3" stroke="#cad9e6" stroke-width="1.5"/><text x="54" y="315" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="54" dy="0">② 内层 TCP 流代理：接管特定 TCP 字节流</tspan></text><text x="54" y="347" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="54" dy="0">KCP TCP 流代理 / QUIC TCP 流代理</tspan><tspan x="54" dy="27">改变这条业务流的传输处理；仍要经 EasyTier 的路径送达。</tspan></text><path d="M380 241 V267" fill="none" stroke="#1257a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><text x="410" y="254" font-size="19" font-weight="400" fill="#1257a6" text-anchor="start"><tspan x="410" dy="0">可组合，但职责不同</tspan></text><rect x="36" y="426" width="332" height="137" rx="12" fill="#eef4fa" stroke="#cad9e6" stroke-width="1.5"/><text x="54" y="463" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="54" dy="0">QUIC：名字相同，位置不同</tspan></text><text x="54" y="495" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="54" dy="0">quic://：隧道选择</tspan><tspan x="54" dy="27">QUIC 代理：TCP 流处理</tspan><tspan x="54" dy="27">看配置所在位置来分辨</tspan></text><rect x="392" y="426" width="332" height="137" rx="12" fill="#fff4db" stroke="#cad9e6" stroke-width="1.5"/><text x="410" y="463" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="410" dy="0">KCP：这里是 TCP 流代理</tspan></text><text x="410" y="495" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="410" dy="0">不是 kcp:// 隧道监听器</tspan><tspan x="410" dy="27">不把所有内层 IP 都变成 KCP</tspan><tspan x="410" dy="27">也不自动消除拥塞问题</tspan></text><rect x="36" y="574" width="688" height="84" rx="12" fill="#eaf7f3" stroke="#afd9ce" stroke-width="1.5"/><text x="54" y="604" font-size="18" font-weight="500" fill="#185e56" text-anchor="start"><tspan x="54" dy="0">v2.6.4 QUIC 隧道用 quinn_plaintext 后端；不能默认推断 TLS 身份安全。</tspan><tspan x="54" dy="28">WSS 的 TLS 客户端跳过服务端证书身份校验；须另核验节点身份。</tspan></text></g></svg>
