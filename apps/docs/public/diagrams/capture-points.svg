<svg xmlns="http://www.w3.org/2000/svg" width="760" height="680" viewBox="0 0 760 680" role="img" aria-labelledby="title desc">
<title id="title">11 · 抓包位置：同一个请求有三种样子</title>
<desc id="desc">A到B的HTTP请求在应用端口体现为业务行为，在A和B的TUN接口显示虚拟IP和内层TCP，在真实网卡显示公网地址与外层隧道。加密开启后真实网卡抓不到内层业务明文，仅凭外层抓包不能证明B上的应用已经响应。</desc>
<defs>
<marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1257a6"/></marker>
<marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#087f75"/></marker>
<marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#617382"/></marker>
</defs>
<rect width="760" height="680" rx="16" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#172b3a">
<text x="36" y="49" font-size="29" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="36" dy="0">11 · 抓包位置：同一个请求有三种样子</tspan></text><text x="36" y="81" font-size="18" font-weight="400" fill="#465968" text-anchor="start"><tspan x="36" dy="0">先选择接口与观察层；再选择 Wireshark / tcpdump 过滤条件。</tspan></text><path d="M36 102 H724" fill="none" stroke="#dbe5ed" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="36" y="126" width="212" height="115" rx="12" fill="#eef4fa" stroke="#cad9e6" stroke-width="1.5"/><text x="54" y="163" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="54" dy="0">A 应用 / 套接字</tspan></text><text x="54" y="195" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="54" dy="0">HTTP 请求、应用端口</tspan><tspan x="54" dy="27">① 查应用与端口</tspan></text><rect x="274" y="126" width="212" height="115" rx="12" fill="#eaf7f3" stroke="#cad9e6" stroke-width="1.5"/><text x="292" y="163" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="292" dy="0">A 的 TUN 接口</tspan></text><text x="292" y="195" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="292" dy="0">10.144.144.1 → .2</tspan><tspan x="292" dy="27">② 查内层 IP / TCP</tspan></text><rect x="512" y="126" width="212" height="115" rx="12" fill="#fff4db" stroke="#cad9e6" stroke-width="1.5"/><text x="530" y="163" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="530" dy="0">A 的真实网卡</tspan></text><text x="530" y="195" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="530" dy="0">公网 IP + 外层隧道</tspan><tspan x="530" dy="27">③ 查实际链路</tspan></text><path d="M251 183 H268" fill="none" stroke="#1257a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M489 183 H506" fill="none" stroke="#1257a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M618 246 V288 H142 V314" fill="none" stroke="#1257a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><text x="302" y="280" font-size="20" font-weight="600" fill="#172b3a" text-anchor="start"><tspan x="302" dy="0">真实网络 / 可选中继 R</tspan></text><rect x="36" y="324" width="212" height="115" rx="12" fill="#fff4db" stroke="#cad9e6" stroke-width="1.5"/><text x="54" y="361" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="54" dy="0">B 的真实网卡</tspan></text><text x="54" y="393" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="54" dy="0">收到外层数据</tspan><tspan x="54" dy="27">④ 不等于业务已成功</tspan></text><rect x="274" y="324" width="212" height="115" rx="12" fill="#eaf7f3" stroke="#cad9e6" stroke-width="1.5"/><text x="292" y="361" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="292" dy="0">B 的 TUN 接口</tspan></text><text x="292" y="393" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="292" dy="0">解密后的内层 IP</tspan><tspan x="292" dy="27">⑤ 查 SYN 与响应</tspan></text><rect x="512" y="324" width="212" height="115" rx="12" fill="#eef4fa" stroke="#cad9e6" stroke-width="1.5"/><text x="530" y="361" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="530" dy="0">B 应用 / 套接字</tspan></text><text x="530" y="393" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="530" dy="0">是否监听、是否接受</tspan><tspan x="530" dy="27">⑥ 查服务与 ACL</tspan></text><path d="M251 383 H268" fill="none" stroke="#087f75" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><path d="M489 383 H506" fill="none" stroke="#087f75" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><text x="36" y="491" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="36" dy="0">TUN 抓包：虚拟地址、TCP 标志、ICMP、业务 DNS 等。</tspan><tspan x="36" dy="34">真实网卡：公网端点、隧道握手、大小与时序；载荷可为密文。</tspan></text><rect x="36" y="602" width="688" height="56" rx="12" fill="#eaf7f3" stroke="#afd9ce" stroke-width="1.5"/><text x="54" y="632" font-size="18" font-weight="500" fill="#185e56" text-anchor="start"><tspan x="54" dy="0">读图结论：同一时段同时看两端，才能区分“发出、送达、处理、返回”。</tspan></text></g></svg>
