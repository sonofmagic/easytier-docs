<svg xmlns="http://www.w3.org/2000/svg" width="760" height="680" viewBox="0 0 760 680" role="img" aria-labelledby="title desc">
<title id="title">04 · 包头与开销：字节也需要空间</title>
<desc id="desc">示例UDP数据包依次含外层IPv4头20字节、UDP头8字节、EasyTier UDP隧道头8字节、节点头16字节、N字节加密载荷以及28字节AEAD尾部。图中为开启加密且未启用secure_mode的普通共享密钥模式。该场景额外开销80字节，不代表其它传输或secure_mode的统一开销。</desc>
<defs>
<marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1257a6"/></marker>
<marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#087f75"/></marker>
<marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#617382"/></marker>
</defs>
<rect width="760" height="680" rx="16" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#172b3a">
<text x="36" y="49" font-size="29" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="36" dy="0">04 · 包头与开销：字节也需要空间</tspan></text><text x="36" y="81" font-size="18" font-weight="400" fill="#465968" text-anchor="start"><tspan x="36" dy="0">v2.6.4 · 普通共享密钥模式 · IPv4 / UDP · AES-GCM · 不压缩</tspan></text><path d="M36 102 H724" fill="none" stroke="#dbe5ed" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="36" y="123" width="185" height="34" rx="17" fill="#1257a6" stroke="#1257a6" stroke-width="1.5"/><text x="128.5" y="147" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle"><tspan x="128.5" dy="0">真实网络可见</tspan></text><rect x="454" y="123" width="270" height="34" rx="17" fill="#087f75" stroke="#087f75" stroke-width="1.5"/><text x="589.0" y="147" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle"><tspan x="589.0" dy="0">载荷经 AES-GCM 加密</tspan></text><rect x="36" y="176" width="100" height="106" rx="12" fill="#eef4fa" stroke="#cad9e6" stroke-width="1.5"/><text x="86.0" y="213" font-size="18" font-weight="700" fill="#172b3a" text-anchor="middle"><tspan x="86.0" dy="0">外层 IPv4</tspan></text><text x="86.0" y="249" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle"><tspan x="86.0" dy="0">20 B</tspan></text><rect x="140" y="176" width="90" height="106" rx="12" fill="#eef4fa" stroke="#cad9e6" stroke-width="1.5"/><text x="185.0" y="213" font-size="18" font-weight="700" fill="#172b3a" text-anchor="middle"><tspan x="185.0" dy="0">UDP</tspan></text><text x="185.0" y="249" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle"><tspan x="185.0" dy="0">8 B</tspan></text><rect x="234" y="176" width="110" height="106" rx="12" fill="#eef4fa" stroke="#cad9e6" stroke-width="1.5"/><text x="289.0" y="213" font-size="18" font-weight="700" fill="#172b3a" text-anchor="middle"><tspan x="289.0" dy="0">隧道头</tspan></text><text x="289.0" y="249" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle"><tspan x="289.0" dy="0">8 B</tspan></text><rect x="348" y="176" width="120" height="106" rx="12" fill="#eef4fa" stroke="#cad9e6" stroke-width="1.5"/><text x="408.0" y="213" font-size="18" font-weight="700" fill="#172b3a" text-anchor="middle"><tspan x="408.0" dy="0">节点头</tspan></text><text x="408.0" y="249" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle"><tspan x="408.0" dy="0">16 B</tspan></text><rect x="472" y="176" width="152" height="106" rx="12" fill="#eaf7f3" stroke="#cad9e6" stroke-width="1.5"/><text x="548.0" y="213" font-size="18" font-weight="700" fill="#172b3a" text-anchor="middle"><tspan x="548.0" dy="0">内层 IP 包</tspan></text><text x="548.0" y="249" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle"><tspan x="548.0" dy="0">N B 密文</tspan></text><rect x="628" y="176" width="96" height="106" rx="12" fill="#fff4db" stroke="#cad9e6" stroke-width="1.5"/><text x="676.0" y="213" font-size="18" font-weight="700" fill="#172b3a" text-anchor="middle"><tspan x="676.0" dy="0">AEAD 尾</tspan></text><text x="676.0" y="249" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle"><tspan x="676.0" dy="0">28 B</tspan></text><rect x="36" y="310" width="332" height="145" rx="12" fill="#eef4fa" stroke="#cad9e6" stroke-width="1.5"/><text x="54" y="347" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="54" dy="0">节点头为什么是 16 B？</tspan></text><text x="54" y="379" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="54" dy="0">源 ID 4 + 目标 ID 4</tspan><tspan x="54" dy="27">类型 / 标志 / 跳数 / 保留 = 4</tspan><tspan x="54" dy="27">长度字段 4</tspan></text><rect x="392" y="310" width="332" height="145" rx="12" fill="#eaf7f3" stroke="#cad9e6" stroke-width="1.5"/><text x="410" y="347" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="410" dy="0">AEAD 尾为什么是 28 B？</tspan></text><text x="410" y="379" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="410" dy="0">认证标签 tag：16</tspan><tspan x="410" dy="27">随机数 nonce：12</tspan><tspan x="410" dy="27">尾部跟在加密载荷之后</tspan></text><text x="36" y="493" font-size="22" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="36" dy="0">总长度 = N + 20 + 8 + 8 + 16 + 28 = N + 80 B</tspan></text><text x="36" y="530" font-size="19" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="36" dy="0">若外层 MTU 为 1500 B，此模型可容纳 N ≤ 1420 B。</tspan><tspan x="36" dy="29">TCP 自定义长度头为 4 B；不能直接沿用 UDP 的总开销。</tspan></text><rect x="36" y="574" width="688" height="84" rx="12" fill="#eaf7f3" stroke="#afd9ce" stroke-width="1.5"/><text x="54" y="604" font-size="18" font-weight="500" fill="#185e56" text-anchor="start"><tspan x="54" dy="0">此处未启用 secure_mode；已开启加密，且 AES-GCM 算法可用。</tspan><tspan x="54" dy="28">IPv6、压缩、代理或其它传输会改变预算；1420 B 不是配置建议。</tspan></text></g></svg>
