<svg xmlns="http://www.w3.org/2000/svg" width="760" height="680" viewBox="0 0 760 680" role="img" aria-labelledby="title desc">
<title id="title">08 · 中继看见什么：先画出安全边界</title>
<desc id="desc">A与B在secure_mode下经R建立端到端数据会话。R可见用于转发的节点元数据和数据量、时序，不能解密A到B的业务载荷。默认共享密钥模式下，同网络且持有共享密钥的节点不应被视为密码学隔离对象。应用TLS是另一个独立边界。</desc>
<defs>
<marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1257a6"/></marker>
<marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#087f75"/></marker>
<marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#617382"/></marker>
</defs>
<rect width="760" height="680" rx="16" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#172b3a">
<text x="36" y="49" font-size="29" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="36" dy="0">08 · 中继看见什么：先画出安全边界</tspan></text><text x="36" y="81" font-size="18" font-weight="400" fill="#465968" text-anchor="start"><tspan x="36" dy="0">这里画 secure_mode 的端到端数据会话；应用 TLS 可再叠加。</tspan></text><path d="M36 102 H724" fill="none" stroke="#dbe5ed" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="36" y="127" width="188" height="106" rx="12" fill="#eaf7f3" stroke="#cad9e6" stroke-width="1.5"/><text x="54" y="164" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="54" dy="0">A：发送端</tspan></text><text x="54" y="196" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="54" dy="0">10.144.144.1</tspan><tspan x="54" dy="27">读取业务明文</tspan></text><rect x="286" y="127" width="188" height="106" rx="12" fill="#fff4db" stroke="#cad9e6" stroke-width="1.5"/><text x="304" y="164" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="304" dy="0">R：中继</tspan></text><text x="304" y="196" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="304" dy="0">按节点头转发</tspan><tspan x="304" dy="27">可见时序 / 流量</tspan></text><rect x="536" y="127" width="188" height="106" rx="12" fill="#eaf7f3" stroke="#cad9e6" stroke-width="1.5"/><text x="554" y="164" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="554" dy="0">B：接收端</tspan></text><text x="554" y="196" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="554" dy="0">10.144.144.2</tspan><tspan x="554" dy="27">恢复业务明文</tspan></text><path d="M228 180 H278" fill="none" stroke="#1257a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M478 180 H528" fill="none" stroke="#1257a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><rect x="36" y="282" width="688" height="105" rx="12" fill="#eaf7f3" stroke="#087f75" stroke-width="1.5" stroke-dasharray="9 6"/><text x="380" y="322" font-size="24" font-weight="700" fill="#172b3a" text-anchor="middle"><tspan x="380" dy="0">A ⇄ B：端到端数据密钥与加密载荷</tspan></text><text x="380" y="357" font-size="20" font-weight="400" fill="#172b3a" text-anchor="middle"><tspan x="380" dy="0">R 转发密文；不持有这条 A—B 会话的端到端密钥</tspan></text><path d="M380 238 V272" fill="none" stroke="#617382" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6" marker-end="url(#arrow-gray)"/><rect x="36" y="423" width="688" height="136" rx="12" fill="#eef4fa" stroke="#cad9e6" stroke-width="1.5"/><text x="54" y="460" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="54" dy="0">共享密钥模式要单独理解</tspan></text><text x="54" y="492" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="54" dy="0">默认非 secure_mode 使用网络共享秘密派生的加密材料。</tspan><tspan x="54" dy="27">同网络且持有共享密钥的成员，不应视为密码学隔离对象。</tspan><tspan x="54" dy="27">应用 TLS 则保护应用端点之间的内容，边界独立于覆盖网络。</tspan></text><rect x="36" y="602" width="688" height="56" rx="12" fill="#eaf7f3" stroke="#afd9ce" stroke-width="1.5"/><text x="54" y="632" font-size="18" font-weight="500" fill="#185e56" text-anchor="start"><tspan x="54" dy="0">读图结论：外部窃听者、中继、同网络成员的可见范围需要分别判断。</tspan></text></g></svg>
