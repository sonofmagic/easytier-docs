<svg xmlns="http://www.w3.org/2000/svg" width="760" height="680" viewBox="0 0 760 680" role="img" aria-labelledby="title desc">
<title id="title">07 · 身份、握手、加密、授权是四件事</title>
<desc id="desc">网络名描述网络身份，网络密钥是共享凭据。默认非secure_mode的数据加密与secure_mode不是同一机制。仅在secure_mode启用时，直接连接采用Noise XX，经中继建立端到端会话采用Noise IK并预先知道对端公钥。ACL再决定哪些业务访问获准，节点公钥不等同于网络密钥。</desc>
<defs>
<marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1257a6"/></marker>
<marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#087f75"/></marker>
<marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#617382"/></marker>
</defs>
<rect width="760" height="680" rx="16" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#172b3a">
<text x="36" y="49" font-size="29" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="36" dy="0">07 · 身份、握手、加密、授权是四件事</tspan></text><text x="36" y="81" font-size="18" font-weight="400" fill="#465968" text-anchor="start"><tspan x="36" dy="0">先确认安全模式，再讨论“谁能读”与“谁能访问”。</tspan></text><path d="M36 102 H724" fill="none" stroke="#dbe5ed" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="36" y="124" width="332" height="136" rx="12" fill="#eef4fa" stroke="#cad9e6" stroke-width="1.5"/><text x="54" y="161" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="54" dy="0">① 网络身份与共享凭据</tspan></text><text x="54" y="193" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="54" dy="0">network_name：网络名</tspan><tspan x="54" dy="27">network_secret：共享秘密</tspan><tspan x="54" dy="27">节点私钥 / 公钥：节点身份</tspan></text><rect x="392" y="124" width="332" height="136" rx="12" fill="#eaf7f3" stroke="#cad9e6" stroke-width="1.5"/><text x="410" y="161" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="410" dy="0">② secure_mode 握手</tspan></text><text x="410" y="193" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="410" dy="0">仅启用安全模式时使用：</tspan><tspan x="410" dy="27">直连 XX；中继端到端 IK</tspan><tspan x="410" dy="27">IK 需要先知道对端公钥</tspan></text><path d="M371 188 H388" fill="none" stroke="#1257a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><rect x="36" y="300" width="332" height="136" rx="12" fill="#eaf7f3" stroke="#cad9e6" stroke-width="1.5"/><text x="54" y="337" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="54" dy="0">③ 数据保密与完整性</tspan></text><text x="54" y="369" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="54" dy="0">默认模式也可启用数据加密</tspan><tspan x="54" dy="27">通常为 AES-GCM（依构建）</tspan><tspan x="54" dy="27">不能把默认加密称为 Noise</tspan></text><rect x="392" y="300" width="332" height="136" rx="12" fill="#fff4db" stroke="#cad9e6" stroke-width="1.5"/><text x="410" y="337" font-size="23" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="410" dy="0">④ ACL：决定允许的访问</tspan></text><text x="410" y="369" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="410" dy="0">访问控制按规则匹配流量</tspan><tspan x="410" dy="27">握手成功 ≠ 所有业务放行</tspan><tspan x="410" dy="27">加密不会替代 ACL</tspan></text><path d="M558 264 V278 H202 V290" fill="none" stroke="#1257a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M371 365 H388" fill="none" stroke="#1257a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><text x="36" y="472" font-size="21" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="36" dy="0">公钥不是密码：可以分发和校验；私钥必须留在节点。</tspan><tspan x="36" dy="35">认证结果必须结合网络凭据、可信公钥与实际配置判断。</tspan></text><rect x="36" y="602" width="688" height="56" rx="12" fill="#eaf7f3" stroke="#afd9ce" stroke-width="1.5"/><text x="54" y="632" font-size="18" font-weight="500" fill="#185e56" text-anchor="start"><tspan x="54" dy="0">读图结论：配置了加密、验证了身份、业务被授权，是三种不同结论。</tspan></text></g></svg>
