<svg xmlns="http://www.w3.org/2000/svg" width="760" height="680" viewBox="0 0 760 680" role="img" aria-labelledby="title desc">
<title id="title">12 · 排障路径：每一步都让证据回答</title>
<desc id="desc">诊断按证据递进：名称能否解析，目标地址和路由是否正确，对等节点路径是否可达，目标服务是否监听和ACL是否允许，TCP是否握手成功。只有大包或长流量失败时再核对MTU PMTUD 丢包 拥塞和重传。各检查失败应修复所在层再复查。</desc>
<defs>
<marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1257a6"/></marker>
<marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#087f75"/></marker>
<marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#617382"/></marker>
</defs>
<rect width="760" height="680" rx="16" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#172b3a">
<text x="36" y="49" font-size="29" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="36" dy="0">12 · 排障路径：每一步都让证据回答</tspan></text><text x="36" y="81" font-size="18" font-weight="400" fill="#465968" text-anchor="start"><tspan x="36" dy="0">从最接近症状的位置开始；不要用一次 ping 替代全部检查。</tspan></text><path d="M36 102 H724" fill="none" stroke="#dbe5ed" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="62" y="125" width="662" height="58" rx="12" fill="#eef4fa" stroke="#cad9e6" stroke-width="1.5"/><text x="80" y="149" font-size="20" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="80" dy="0">① 名称 → 地址</tspan></text><text x="80" y="174" font-size="19" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="80" dy="0">DNS 结果是否是预期的虚拟地址？</tspan></text><path d="M44 143 V214" fill="none" stroke="#1257a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><rect x="62" y="195" width="662" height="58" rx="12" fill="#eef4fa" stroke="#cad9e6" stroke-width="1.5"/><text x="80" y="219" font-size="20" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="80" dy="0">② 地址 → 路由</tspan></text><text x="80" y="244" font-size="19" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="80" dy="0">目标路由是否进入 TUN？有无路由冲突？</tspan></text><path d="M44 213 V284" fill="none" stroke="#1257a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><rect x="62" y="265" width="662" height="58" rx="12" fill="#eef4fa" stroke="#cad9e6" stroke-width="1.5"/><text x="80" y="289" font-size="20" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="80" dy="0">③ 对等节点 → 路径</tspan></text><text x="80" y="314" font-size="19" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="80" dy="0">peer / route 信息有路径吗？直连还是经 R？</tspan></text><path d="M44 283 V354" fill="none" stroke="#1257a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><rect x="62" y="335" width="662" height="58" rx="12" fill="#eef4fa" stroke="#cad9e6" stroke-width="1.5"/><text x="80" y="359" font-size="20" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="80" dy="0">④ 目标 → 服务</tspan></text><text x="80" y="384" font-size="19" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="80" dy="0">B 是否监听目标端口？ACL 是否允许？</tspan></text><path d="M44 353 V424" fill="none" stroke="#1257a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><rect x="62" y="405" width="662" height="58" rx="12" fill="#eef4fa" stroke="#cad9e6" stroke-width="1.5"/><text x="80" y="429" font-size="20" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="80" dy="0">⑤ TCP → 建连</tspan></text><text x="80" y="454" font-size="19" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="80" dy="0">A 发 SYN；B 回 SYN-ACK；回程是否到 A？</tspan></text><path d="M44 423 V494" fill="none" stroke="#1257a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><rect x="62" y="475" width="662" height="58" rx="12" fill="#eaf7f3" stroke="#cad9e6" stroke-width="1.5"/><text x="80" y="499" font-size="20" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="80" dy="0">⑥ 小包成功 → 大包失败</tspan></text><text x="80" y="524" font-size="19" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="80" dy="0">检查 MTU / PMTUD、重传、丢包与拥塞。</tspan></text><rect x="36" y="602" width="688" height="56" rx="12" fill="#eaf7f3" stroke="#afd9ce" stroke-width="1.5"/><text x="54" y="632" font-size="18" font-weight="500" fill="#185e56" text-anchor="start"><tspan x="54" dy="0">遇到“不符合预期”的证据：先修对应层，再按同样方法复查。</tspan></text></g></svg>
