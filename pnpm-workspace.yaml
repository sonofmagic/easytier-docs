packages:
  - apps/*
  - packages/*
  - templates/*
  - '!**/test/**'
  - examples/*
minimumReleaseAge: 0
pmOnFail: error
versioning:
  changelog:
    storage: repository
allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  vue-demi: true
  workerd: true
overrides:
  prettier: 3.9.9
  typescript: 6.0.3
  '@arethetypeswrong/core>typescript': 5.9.3
  vite: 8.3.4
  postcss: 8.5.29
  postcss-selector-parser: 7.1.6
  js-yaml: 5.4.3
  nanoid: 6.0.2
  brace-expansion: 5.0.12
  minimatch@<4>brace-expansion: 1.1.21
  minimatch@>=4 <10>brace-expansion: 2.1.7
  cross-spawn: 7.0.6
  adm-zip: 0.6.1
  uuid: 14.0.2
  esbuild: 0.28.2
